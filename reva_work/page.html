<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reva Nexus</title><link rel="stylesheet" href="style.css"></head><body><main style="max-width:980px;margin:0 auto;padding:48px 24px"><a href="/">← Reva Nexus</a><article id="page" style="margin-top:40px"><p>Loading…</p></article></main><script>
const esc=x=>String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
(async()=>{const slug=location.pathname.split('/').filter(Boolean).pop();const lang=localStorage.getItem('revaLang')||'en';const r=await fetch('/api/pages/'+encodeURIComponent(slug));if(!r.ok){document.getElementById('page').innerHTML='<h1>Page not found</h1>';return}const p=await r.json();document.title=(p.title?.[lang]||p.title?.en||slug)+' · Reva Nexus';document.getElementById('page').innerHTML=`<h1>${esc(p.title?.[lang]||p.title?.en||slug)}</h1><div style="white-space:pre-wrap;line-height:1.8">${esc(p.body?.[lang]||p.body?.en||'')}</div>`})().catch(()=>{document.getElementById('page').innerHTML='<h1>Unable to load page</h1>'});
</script></body></html>
